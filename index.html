<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中國歷史互動溫習平台</title>
    <style>
        :root {
            --primary-color: #8B4513; /* 復古棕色 */
            --secondary-color: #FDF5E6; /* 宣紙米色 */
            --accent-color: #D2691E;
            --text-color: #333333;
        }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #5c2c16;
            padding: 1rem;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: transparent;
            border: 2px solid #DEB887;
            color: white;
            padding: 0.6rem 1.2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #DEB887;
            color: var(--primary-color);
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-content {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--accent-color);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #333;
            color: white;
            margin-top: 3rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📜 中國歷史互動溫習平台</h1>
        <p>輕鬆溫習，掌握每一個朝代與歷史變局</p>
    </header>

    <nav>
        <a href="index.html" class="nav-btn active">首頁</a>
        <a href="Chapter2.html" class="nav-btn">課題2 西周的封建</a>
        <a href="Chapter3.html" class="nav-btn">課題3 春秋戰國時期的變局</a>
    </nav>

    <main>
        <div class="section-content">
            <h2>歡迎來到中史溫習天地</h2>
            <p>本平台旨在幫助同學透過互動方式溫習初中中國歷史課程。</p>
            <p>請點擊上方導航列中的相應課題按鈕，開始你的溫習之旅：</p>
            <ul>
                <li><strong>課題2 西周的封建：</strong> 了解周初如何分封諸侯，以及宗法制度的建立。</li>
                <li><strong>課題3 春秋戰國時期的變局：</strong> 探討社會轉型、百家爭鳴與各國變法。</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 中國歷史互動溫習平台. 版權所有.</p>
    </footer>

</body>
</html>
